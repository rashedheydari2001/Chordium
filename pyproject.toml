[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chordium"
version = "1.0.0"
description = "A lightweight GTK4 music player built with Python and GStreamer"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
chordium = "Chordium:main"

[tool.setuptools]
py-modules = ["Chordium"]
